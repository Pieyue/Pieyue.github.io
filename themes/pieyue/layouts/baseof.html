<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="description" content="{{ site.Params.description }}">
  <meta name="theme-color" content="#1b2230">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
  <link rel="icon" href="{{ "favicon.svg" | relURL }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;900&family=ZCOOL+XiaoWei&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}?v={{ now.Unix }}">
</head>
<body data-page="{{ if .IsHome }}home{{ else if .IsPage }}{{ if eq .Layout "search" }}search{{ else }}post{{ end }}{{ else }}list{{ end }}">
  <div id="wallpaper-layer" aria-hidden="true"></div>
  <canvas id="rain-canvas" aria-hidden="true"></canvas>

  {{ partial "topbar.html" . }}

  <main id="app-main">{{ block "main" . }}{{ end }}</main>

  {{ partial "player.html" . }}
  <div id="toast" role="status" aria-live="polite"></div>

  {{ partial "site-data.html" . }}
  <script src="{{ "js/app.js" | relURL }}?v={{ now.Unix }}" defer></script>
  <script src="{{ "js/player.js" | relURL }}?v={{ now.Unix }}" defer></script>
  <script src="{{ "js/modes.js" | relURL }}?v={{ now.Unix }}" defer></script>
  <script src="{{ "js/weather.js" | relURL }}?v={{ now.Unix }}" defer></script>
  <script src="{{ "js/toc.js" | relURL }}?v={{ now.Unix }}" defer></script>
  <script src="{{ "js/search.js" | relURL }}?v={{ now.Unix }}" defer></script>
</body>
</html>
