<header id="topbar">
  <div class="topbar-left">
    <a class="brand content-only" href="{{ site.Home.RelPermalink }}">{{ site.Title }}</a>
    <nav class="site-nav content-only" aria-label="站点导航">
      <a href="{{ site.Home.RelPermalink }}">主页</a>
      <a href="{{ "posts/" | relURL }}">文章</a>
    </nav>
  </div>
  <div class="topbar-right">
    <button id="btn-weather" class="icon-btn" title="天气" aria-haspopup="true" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 14.9A7 7 0 1 1 15.7 8h1.8a4.5 4.5 0 0 1 2.5 8.2"/>
        <line x1="8" y1="18" x2="8" y2="20"/><line x1="12" y1="16" x2="12" y2="20"/><line x1="16" y1="18" x2="16" y2="20"/>
      </svg>
    </button>
    <button id="btn-night" class="icon-btn" title="白天 / 黑夜模式">
      <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button id="btn-mode" class="pill-btn" title="切换模式">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="6.5" cy="15" r="3.8"/><circle cx="17.5" cy="15" r="3.8"/>
        <path d="M10.3 15h3.4"/><path d="M2.7 13 4 9.2C4.3 8.5 5 8 5.8 8h3.4M21.3 13 20 9.2C19.7 8.5 19 8 18.2 8h-3.4"/>
      </svg>
      <span id="mode-label">通透模式</span>
    </button>
    <button id="btn-note" class="icon-btn" title="音乐 开 / 关" aria-label="音乐开关">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 19.2a3 3 0 1 1-2-2.83V6.2a1 1 0 0 1 .8-.98l9.5-1.9a1 1 0 0 1 1.2.98v10.9a3 3 0 1 1-2-2.83V8.1l-7.5 1.5z"/></svg>
      <span class="x-badge" aria-hidden="true">✕</span>
    </button>
  </div>
</header>
